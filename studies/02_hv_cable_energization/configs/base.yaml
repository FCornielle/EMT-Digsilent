study:
  id: hv_cable_energization_220kv
  case_number: 2
  title: 220 kV XLPE cable energization and sheath bonding
  owner: Fernando Cornielle
  status: engineering_basis

connection:
  mode: external
  home:
  username:
  password:
  command_line:

powerfactory:
  project: PFEMT_02_HV_Cable_Energization_220kV
  grid: GRID_220KV_CABLE
  study_case: EMT - Cable Energization and Bonding

objects:
  source: GRID_EQUIVALENT
  sending_bus: BUS_CABLE_SENDING_220
  cable_bus: BUS_CABLE_LINE_SIDE_220
  receiving_bus: BUS_CABLE_RECEIVING_220
  breaker: CB_CABLE_220
  core_line: CABLE_CORE_220KV_40KM
  sheath_sending_bus: BUS_SHEATH_SENDING_220
  sheath_receiving_bus: BUS_SHEATH_RECEIVING_220
  sheath_line: CABLE_SHEATH_220KV_40KM
  sheath_ground_sending: GND_SHEATH_SENDING_220
  sheath_ground_receiving: GND_SHEATH_RECEIVING_220
  cable_system: CABLE_COUPLING_220KV_40KM

network:
  nominal_voltage_kv: 220.0
  frequency_hz: 50.0
  source:
    voltage_pu: 1.0
    short_circuit_mva: 8000.0
    r_over_x: 0.10
  cable:
    type_name: XLPE_220KV_1200CU_ABB_EQUIVALENT
    system_type_name: CABLE_SYSTEM_220KV_EXPLICIT_SHEATH
    length_km: 40.0
    rated_current_ka: 1.0
    burial_depth_m: 1.5
    phase_spacing_m: 0.35
    soil_resistivity_ohm_m: 100.0
    geometry:
      source_id: ABB_2GM5007_TABLE_37_220KV_1200CU
      source_url: https://resources.news.e.abb.com/attachments/published/13326/en-US/55ED60680654/XLPE-Submarine-Cable-Systems-2GM5007-.pdf
      conductor:
        material: annealed_copper
        area_mm2: 1200.0
        diameter_mm: 41.2
        resistivity_uohm_cm_20c: 1.77
        temperature_coefficient_per_k: 0.00382
      main_insulation:
        material: xlpe
        nominal_thickness_mm: 23.0
        capacitance_target_uf_per_km: 0.20
        loss_tangent: 0.0002
      diameter_over_insulation_mm: 90.6
      sheath:
        material: lead
        thickness_mm: 3.1
        resistivity_uohm_cm_20c: 20.65
        temperature_coefficient_per_k: 0.0040
      oversheath:
        material: polyethylene_equivalent
        relative_permittivity: 2.3
        loss_tangent: 0.001
      overall_diameter_mm: 125.2
    electrical:
      r1_ohm_per_km: 0.024
      r0_ohm_per_km: 0.180
      inductance_mh_per_km: 1.330
      inductance0_mh_per_km: 2.500
      capacitance_uf_per_km: 0.200
      capacitance0_uf_per_km: 0.160
    emt_model:
      representation: distributed_frequency_dependent_phase_domain
      fit_frequency_min_hz: 10.0
      fit_frequency_max_hz: 20000.0
      main_transient_frequency_hz: 2000.0

bonding_cases:
  - id: isolated
    label: Isolated screen
    grounded_sending: false
    grounded_receiving: false
    cross_bonded: false
  - id: single_point
    label: Single-point bonded
    grounded_sending: true
    grounded_receiving: false
    cross_bonded: false
  - id: both_ends
    label: Bonded at both ends
    grounded_sending: true
    grounded_receiving: true
    cross_bonded: false
  - id: cross_bonded
    # Ideal section transposition represented by the TypCabsys bonding flag.
    label: Cross-bonded (ideal TypCabsys)
    grounded_sending: true
    grounded_receiving: true
    cross_bonded: true

sweep:
  base_switching_time_s: 0.020
  angles_deg: [0, 30, 60, 90, 120, 150]

simulation:
  start_s: -0.020
  stop_s: 0.120
  step_s: 0.0000025
  output_step_s: 0.0000025
  mode: instantaneous_emt
  mode_code: ins

events:
  closing:
    name: CLOSE_CB_CABLE
    action: 1

results:
  channels:
    - object: BUS_CABLE_RECEIVING_220.ElmTerm
      variable: m:U:A
    - object: BUS_CABLE_RECEIVING_220.ElmTerm
      variable: m:U:B
    - object: BUS_CABLE_RECEIVING_220.ElmTerm
      variable: m:U:C
    - object: BUS_SHEATH_SENDING_220.ElmTerm
      variable: m:U:A
    - object: BUS_SHEATH_SENDING_220.ElmTerm
      variable: m:U:B
    - object: BUS_SHEATH_SENDING_220.ElmTerm
      variable: m:U:C
    - object: BUS_SHEATH_RECEIVING_220.ElmTerm
      variable: m:U:A
    - object: BUS_SHEATH_RECEIVING_220.ElmTerm
      variable: m:U:B
    - object: BUS_SHEATH_RECEIVING_220.ElmTerm
      variable: m:U:C
    - object: CABLE_CORE_220KV_40KM.ElmLne
      variable: m:I:bus1:A
    - object: CABLE_CORE_220KV_40KM.ElmLne
      variable: m:I:bus1:B
    - object: CABLE_CORE_220KV_40KM.ElmLne
      variable: m:I:bus1:C
    - object: CABLE_SHEATH_220KV_40KM.ElmLne
      variable: m:I:bus1:A
    - object: CABLE_SHEATH_220KV_40KM.ElmLne
      variable: m:I:bus1:B
    - object: CABLE_SHEATH_220KV_40KM.ElmLne
      variable: m:I:bus1:C
    - object: GND_SHEATH_SENDING_220.ElmGndswt
      variable: m:I:bus1:A
    - object: GND_SHEATH_SENDING_220.ElmGndswt
      variable: m:I:bus1:B
    - object: GND_SHEATH_SENDING_220.ElmGndswt
      variable: m:I:bus1:C
    - object: GND_SHEATH_RECEIVING_220.ElmGndswt
      variable: m:I:bus1:A
    - object: GND_SHEATH_RECEIVING_220.ElmGndswt
      variable: m:I:bus1:B
    - object: GND_SHEATH_RECEIVING_220.ElmGndswt
      variable: m:I:bus1:C

analysis:
  decimal: "."
  column_map:
    time_s: time
    v_core_recv_a_kv: BUS_CABLE_RECEIVING_220.ElmTerm | Phase Voltage A
    v_core_recv_b_kv: BUS_CABLE_RECEIVING_220.ElmTerm | Phase Voltage B
    v_core_recv_c_kv: BUS_CABLE_RECEIVING_220.ElmTerm | Phase Voltage C
    v_sheath_send_a_kv: BUS_SHEATH_SENDING_220.ElmTerm | Phase Voltage A
    v_sheath_send_b_kv: BUS_SHEATH_SENDING_220.ElmTerm | Phase Voltage B
    v_sheath_send_c_kv: BUS_SHEATH_SENDING_220.ElmTerm | Phase Voltage C
    v_sheath_recv_a_kv: BUS_SHEATH_RECEIVING_220.ElmTerm | Phase Voltage A
    v_sheath_recv_b_kv: BUS_SHEATH_RECEIVING_220.ElmTerm | Phase Voltage B
    v_sheath_recv_c_kv: BUS_SHEATH_RECEIVING_220.ElmTerm | Phase Voltage C
    i_core_send_a_ka: CABLE_CORE_220KV_40KM.ElmLne | Phase Current A/Terminal i
    i_core_send_b_ka: CABLE_CORE_220KV_40KM.ElmLne | Phase Current B/Terminal i
    i_core_send_c_ka: CABLE_CORE_220KV_40KM.ElmLne | Phase Current C/Terminal i
    i_sheath_send_a_ka: CABLE_SHEATH_220KV_40KM.ElmLne | Phase Current A/Terminal i
    i_sheath_send_b_ka: CABLE_SHEATH_220KV_40KM.ElmLne | Phase Current B/Terminal i
    i_sheath_send_c_ka: CABLE_SHEATH_220KV_40KM.ElmLne | Phase Current C/Terminal i
    i_ground_send_a_ka: GND_SHEATH_SENDING_220.ElmGndswt | Phase Current A in kA
    i_ground_send_b_ka: GND_SHEATH_SENDING_220.ElmGndswt | Phase Current B in kA
    i_ground_send_c_ka: GND_SHEATH_SENDING_220.ElmGndswt | Phase Current C in kA
    i_ground_recv_a_ka: GND_SHEATH_RECEIVING_220.ElmGndswt | Phase Current A in kA
    i_ground_recv_b_ka: GND_SHEATH_RECEIVING_220.ElmGndswt | Phase Current B in kA
    i_ground_recv_c_ka: GND_SHEATH_RECEIVING_220.ElmGndswt | Phase Current C in kA

outputs:
  directory: ../outputs

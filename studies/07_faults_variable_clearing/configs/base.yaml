study:
  id: faults_variable_clearing_230kv
  title: 230 kV fault-type and variable-clearing EMT campaign
  owner: Fernando Cornielle
  status: engineering_example

connection:
  mode: external
  home:
  username:
  password:
  command_line:

powerfactory:
  project: PFEMT_07_Fault_Clearing_230kV
  grid: GRID_FAULTS_230KV
  study_case: EMT - Fault Clearing

diagram:
  name: EMT Fault Clearing 230 kV

objects:
  source: GRID_EQUIVALENT_FAULT
  source_bus: BUS_SOURCE_230
  breaker: CB_FEEDER_230
  load_bus: BUS_LINE_SENDING_230
  impedance: LINE_EQUIVALENT_FAULT
  fault_bus: BUS_FAULT_230

network:
  frequency_hz: 50.0
  nominal_voltage_kv: 230.0
  source:
    voltage_pu: 1.0
    short_circuit_mva: 10000.0
    r_over_x: 0.10
    x0_over_x1: 1.0
    r0_over_x0: 0.10
  impedance:
    Sn: 100.0
    r_pu: 0.010
    x_pu: 0.150
    r0_pu: 0.030
    x0_pu: 0.450
  source_capacitance_mvar: 0.0
  load_capacitance_mvar: 0.0

sweep:
  fault_time_s: 0.020
  clearing_times_s: [0.060, 0.100, 0.140]
  fault_types:
    - id: single_phase_ground
      label: Single-phase-to-ground fault, phase A
      code: 2
      phase_selector: 0
    - id: phase_to_phase
      label: Phase-to-phase fault, phases A-B
      code: 1
      phase_selector: 0
    - id: three_phase
      label: Three-phase bolted fault
      code: 0
      phase_selector: 0

simulation:
  mode: instantaneous_emt
  mode_code: ins
  start_s: -0.005
  stop_s: 0.180
  step_s: 0.000010
  output_step_s: 0.000010

events:
  fault:
    name: APPLY_FAULT
    resistance_ohm: 0.10
    reactance_ohm: 0.0
  clearing:
    name: CLEAR_FAULT

results:
  channels:
    - {object: CB_FEEDER_230.ElmCoup, variable: "m:I:bus1:A"}
    - {object: CB_FEEDER_230.ElmCoup, variable: "m:I:bus1:B"}
    - {object: CB_FEEDER_230.ElmCoup, variable: "m:I:bus1:C"}
    - {object: BUS_FAULT_230.ElmTerm, variable: "m:U:A"}
    - {object: BUS_FAULT_230.ElmTerm, variable: "m:U:B"}
    - {object: BUS_FAULT_230.ElmTerm, variable: "m:U:C"}
    - {object: BUS_SOURCE_230.ElmTerm, variable: "m:U:A"}
    - {object: BUS_SOURCE_230.ElmTerm, variable: "m:U:B"}
    - {object: BUS_SOURCE_230.ElmTerm, variable: "m:U:C"}

analysis:
  decimal: "."
  column_map:
    time_s: time
    i_a_ka: CB_FEEDER_230.ElmCoup | Phase Current A
    i_b_ka: CB_FEEDER_230.ElmCoup | Phase Current B
    i_c_ka: CB_FEEDER_230.ElmCoup | Phase Current C
    v_fault_a_kv: BUS_FAULT_230.ElmTerm | Phase Voltage A
    v_fault_b_kv: BUS_FAULT_230.ElmTerm | Phase Voltage B
    v_fault_c_kv: BUS_FAULT_230.ElmTerm | Phase Voltage C
    v_source_a_kv: BUS_SOURCE_230.ElmTerm | Phase Voltage A
    v_source_b_kv: BUS_SOURCE_230.ElmTerm | Phase Voltage B
    v_source_c_kv: BUS_SOURCE_230.ElmTerm | Phase Voltage C

outputs:
  directory: ../outputs
  project_archive: ../powerfactory/PFEMT_07_Fault_Clearing_230kV.pfd

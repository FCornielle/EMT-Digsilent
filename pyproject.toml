[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pfemt-industrial-studies"
version = "0.1.0"
description = "Reproducible industrial EMT studies with DIgSILENT PowerFactory and Python"
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = {text = "MIT"}
authors = [
  {name = "Fernando Cornielle", email = "fernandocornielle@gmail.com"}
]
keywords = ["PowerFactory", "EMT", "power systems", "transients", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.9",
  "Topic :: Scientific/Engineering"
]
dependencies = [
  "matplotlib>=3.7,<4",
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "PyYAML>=6,<7"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4,<9",
  "pytest-cov>=4.1,<6",
  "ruff>=0.5,<1"
]

[project.scripts]
pfemt = "pfemt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "powerfactory: runs against an installed PowerFactory application"
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM"]
